name: destroy

# Chamado pelo destroy-all do fiapx-infra (ADR-018), antes do auth e da infraestrutura. Apagar o namespace
# remove o TargetGroupBinding (o controller solta os alvos do ALB) e os demais recursos do serviço.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-video-api }
      - id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Recursos no EKS
        run: |
          if cluster=$(aws ssm get-parameter --name /fiapx/prod/eks/cluster_name --query Parameter.Value --output text 2>/dev/null); then
            aws eks update-kubeconfig --name "$cluster"
            kubectl delete namespace fiapx --ignore-not-found --wait --timeout=10m
          else
            echo "Cluster já não existe; nada a apagar no Kubernetes."
          fi
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Terraform destroy (rotas)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform destroy -auto-approve -input=false -lock-timeout=10m
