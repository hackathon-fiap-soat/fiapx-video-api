name: CI · testes, imagem, manifests e Terraform do video-api

# Checks de todo PR (spec §11.2): pint, phpstan, phpunit (cobertura ≥ 80%, com MySQL e LocalStack do
# fiapx-infra/local), behat (SAGA), build da imagem + Trivy, kustomize + kubeconform e terraform validate.
# O deploy está em deploy.yml (ADR-018, credenciais da AWS Academy, ADR-019). O SonarCloud entra na Etapa 8.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Lint e testes (Pint, PHPStan, PHPUnit e Behat)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fiapx-video-api
    steps:
      # Repositórios lado a lado, como na máquina de quem desenvolve (o compose monta ../fiapx-docs).
      - name: Baixar o fiapx-video-api
        uses: actions/checkout@v4
        # Histórico completo: o SonarCloud usa o blame para separar código novo do antigo.
        with: { path: fiapx-video-api, fetch-depth: 0 }
      - name: Baixar o fiapx-docs (contratos)
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-docs, path: fiapx-docs }
      - name: Baixar o fiapx-infra (ambiente local)
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-infra, path: fiapx-infra }
      - name: Subir o ambiente local (MySQL, LocalStack e Mailpit)
        working-directory: fiapx-infra/local
        run: docker compose up -d --wait
      - name: Preparar o app (imagem de desenvolvimento, dependências, chave e migrations)
        run: |
          cp .env.example .env
          docker compose build -q app
          docker compose run --rm -q app composer install --no-interaction --no-progress
          docker compose run --rm -q app php artisan key:generate
          docker compose run --rm -q app php artisan migrate --force
      - name: Rodar o Pint e o PHPStan
        run: docker compose run --rm -q app composer lint
      - name: Rodar o PHPUnit com cobertura ≥ 80% (unit, feature, contrato e integração)
        run: docker compose run --rm -q app composer test:coverage
      - name: Ajustar os caminhos da cobertura (do container para o runner)
        # O PHPUnit roda no container, com o código em /var/www/html; o scanner roda no runner.
        run: sudo sed -i "s#/var/www/html#$GITHUB_WORKSPACE/fiapx-video-api#g" coverage/clover.xml
      - name: Analisar no SonarCloud e esperar o Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        with:
          projectBaseDir: fiapx-video-api
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Rodar o Behat (cenários obrigatórios da SAGA)
        run: docker compose run --rm -q app composer bdd
      - name: Mostrar os logs do ambiente local (só em falha)
        if: failure()
        working-directory: fiapx-infra/local
        run: docker compose logs --no-color

  imagem:
    name: Imagem de produção e Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Construir a imagem de produção (linux/amd64)
        run: docker build --platform linux/amd64 -t fiapx-video-api:${{ github.sha }} .
      - name: Procurar vulnerabilidades CRITICAL na imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiapx-video-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    name: Manifests do Kubernetes (kustomize e kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Gerar e validar os manifests do overlay prod (kustomize e kubeconform)
        run: |
          cp k8s/overlays/prod/aws.env.example k8s/overlays/prod/aws.env
          docker run --rm -v "$PWD/k8s":/k8s registry.k8s.io/kustomize/kustomize:v5.6.0 build /k8s/overlays/prod > manifests.yaml
          docker run --rm -v "$PWD":/w ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /w/manifests.yaml

  terraform:
    name: Terraform (fmt e validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8 }
      - name: Conferir a formatação (terraform fmt)
        run: terraform fmt -check -recursive
      - name: Inicializar sem backend (terraform init)
        run: terraform init -backend=false -input=false
      - name: Validar a configuração (terraform validate)
        run: terraform validate
