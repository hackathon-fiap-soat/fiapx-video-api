name: Deploy · video-api no EKS (imagem, rotas e migrations)

# Deploy do video-api (ADR-018): no merge na main e chamado pelo deploy-all do fiapx-infra.
# Imagem no ECR → rotas no API Gateway (Terraform) → manifests no EKS, com a migração antes dos Deployments.
# Credenciais da AWS Academy em Secrets (ADR-019). Com o ambiente destruído, falha ao ler o SSM.
on:
  push:
    branches: [main]
    # Mudança só de documentação ou de contexto do Claude não reimplanta o serviço.
    paths-ignore: ["**.md", ".claude/**", "docs/**", "LICENSE"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fiapx-video-api
  cancel-in-progress: false

env:
  SSM: /fiapx/prod

jobs:
  # Chamado pelo deploy-all, aparece como "4 · Video API (EKS) / Implantar".
  deploy:
    name: Implantar
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 40
    steps:
      - name: Baixar o fiapx-video-api
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-video-api }
      - name: Autenticar na AWS Academy e garantir o bucket do state
        id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Ler parâmetros do SSM e gerar o aws.env (ambiente no ar e na ordem certa?)
        id: p
        run: |
          set -euo pipefail
          ler() { aws ssm get-parameter --name "$SSM/$1" --query Parameter.Value --output text 2>/dev/null || {
            echo "::error::Falta $SSM/$1. Ambiente fora do ar ou fora de ordem: rode o deploy-all no fiapx-infra."; exit 1; }; }
          {
            echo "cluster=$(ler eks/cluster_name)"
            echo "ecr=$(ler ecr/fiapx-video-api/url)"
            echo "db_secret=$(ler db/video/secret_arn)"
          } >> "$GITHUB_OUTPUT"
          ler auth/authorizer_id >/dev/null
          cat > k8s/overlays/prod/aws.env <<ENV
          FIAPX_ENV=prod
          AWS_REGION=$(ler region)
          S3_VIDEOS_BUCKET=$(ler s3/videos_bucket)
          SQS_VIDEO_UPLOADED_URL=$(ler sqs/video-uploaded/url)
          SQS_SAGA_REPLIES_URL=$(ler sqs/saga-replies/url)
          SQS_PROCESSING_COMMANDS_URL=$(ler sqs/processing-commands/url)
          SQS_NOTIFICATION_COMMANDS_URL=$(ler sqs/notification-commands/url)
          TARGET_GROUP_ARN=$(ler alb/target_group_arn)
          NEW_RELIC_ENABLED=${{ secrets.NEW_RELIC_LICENSE_KEY != '' && 'true' || 'false' }}
          ENV
          sed -i 's/^ *//' k8s/overlays/prod/aws.env

      - name: Construir a imagem (linux/amd64) e enviar ao ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ steps.p.outputs.ecr }}"
          docker build --platform linux/amd64 -t "${{ steps.p.outputs.ecr }}:${{ github.sha }}" .
          docker push "${{ steps.p.outputs.ecr }}:${{ github.sha }}"

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Aplicar as rotas /api/videos* e /api/health/* no API Gateway (Terraform)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform apply -auto-approve -input=false -lock-timeout=10m

      - name: Configurar o acesso ao cluster EKS (kubeconfig)
        run: aws eks update-kubeconfig --name "${{ steps.p.outputs.cluster }}"

      - name: Criar os Secrets do Kubernetes (banco e app)
        env:
          NR_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -euo pipefail
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -
          db=$(aws secretsmanager get-secret-value --secret-id "${{ steps.p.outputs.db_secret }}" --query SecretString --output text)
          kubectl -n fiapx create secret generic fiapx-video-api-db --dry-run=client -o yaml \
            --from-literal=DB_HOST="$(jq -r .host <<<"$db")" \
            --from-literal=DB_PORT="$(jq -r .port <<<"$db")" \
            --from-literal=DB_DATABASE="$(jq -r .dbname <<<"$db")" \
            --from-literal=DB_USERNAME="$(jq -r .username <<<"$db")" \
            --from-literal=DB_PASSWORD="$(jq -r .password <<<"$db")" | kubectl apply -f -
          # APP_KEY é gerada uma vez e mantida entre deploys.
          app_key=$(kubectl -n fiapx get secret fiapx-video-api-app -o jsonpath='{.data.APP_KEY}' 2>/dev/null | base64 -d || true)
          [ -n "$app_key" ] || app_key="base64:$(openssl rand -base64 32)"
          kubectl -n fiapx create secret generic fiapx-video-api-app --dry-run=client -o yaml \
            --from-literal=APP_KEY="$app_key" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${NR_KEY}" | kubectl apply -f -

      # A migração roda antes dos Deployments: se o Job falhar, os pods antigos continuam no ar.
      - name: Aplicar os manifests, menos Deployments e CronJob (inclui o Job de migrations)
        run: |
          set -euo pipefail
          sed -i "s|newName: fiapx-video-api|newName: ${{ steps.p.outputs.ecr }}|; s|newTag: latest|newTag: ${{ github.sha }}|" \
            k8s/overlays/prod/kustomization.yaml
          kubectl kustomize k8s/overlays/prod > manifests.yaml
          kubectl -n fiapx delete job video-api-migrate --ignore-not-found --wait
          yq 'select(.kind != "Deployment" and .kind != "CronJob")' manifests.yaml | kubectl apply -f -

      - name: Aguardar o Job de migrations
        run: |
          set -euo pipefail
          if ! kubectl -n fiapx wait --for=condition=complete job/video-api-migrate --timeout=5m; then
            kubectl -n fiapx logs job/video-api-migrate --tail=100 || true
            echo "::error::A migração falhou; os Deployments não foram atualizados."
            exit 1
          fi

      - name: Aplicar os Deployments e o CronJob com a imagem nova
        run: kubectl apply -f manifests.yaml

      - name: Aguardar o rollout dos Deployments (web, outbox-relay, saga-consumer e daemon do New Relic)
        run: |
          set -euo pipefail
          for d in video-api-web video-api-outbox-relay video-api-saga-consumer newrelic-php-daemon; do
            kubectl -n fiapx rollout status deployment/$d --timeout=5m
          done

      - name: Escrever o resumo do deploy
        run: |
          api=$(aws ssm get-parameter --name "$SSM/apigw/url" --query Parameter.Value --output text)
          {
            echo "### fiapx-video-api implantado"
            echo "- Imagem: \`${{ steps.p.outputs.ecr }}:${{ github.sha }}\`"
            echo "- Health: $api/api/health/ready"
          } >> "$GITHUB_STEP_SUMMARY"
