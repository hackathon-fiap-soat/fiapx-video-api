# video-api-web: php-fpm + nginx no mesmo pod. HPA por CPU (70%), de 2 a 6 réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api-web
  labels: { app.kubernetes.io/name: video-api-web, app.kubernetes.io/part-of: fiapx }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: video-api-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: video-api-web, app.kubernetes.io/part-of: fiapx }
    spec:
      serviceAccountName: fiapx-video-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: php-fpm
          image: fiapx-video-api
          envFrom:
            - configMapRef: { name: fiapx-video-api-base }
            - configMapRef: { name: fiapx-video-api-aws }
            - secretRef: { name: fiapx-video-api-db }
            - secretRef: { name: fiapx-video-api-app, optional: true }
          ports: [{ containerPort: 9000, name: fpm }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: nginx-templates, mountPath: /etc/nginx/templates }
      # O nginx só repassa tudo ao index.php do php-fpm (API JSON): não precisa dos arquivos de public/.
      volumes:
        - { name: nginx-templates, configMap: { name: fiapx-video-api-nginx } }
