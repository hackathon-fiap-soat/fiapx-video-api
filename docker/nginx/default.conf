# nginx na frente do php-fpm (sidecar no mesmo pod; no compose local, serviço "web").
server {
    listen 8080;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 1m;   # o vídeo vai direto para o S3; a API só recebe JSON
    server_tokens off;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass ${PHP_FPM_HOST}:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }
}
